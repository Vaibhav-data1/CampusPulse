services:
  - type: web
    name: campuspulse-api
    runtime: python
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: PYTHONPATH=app/backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CAMPUSPULSE_CORS_ORIGINS
        sync: false
      - key: CAMPUSPULSE_DATABASE_PATH
        value: /var/data/campuspulse.db

  - type: static
    name: campuspulse-web
    buildCommand: npm --prefix app/frontend ci && npm --prefix app/frontend run build
    staticPublishPath: app/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
